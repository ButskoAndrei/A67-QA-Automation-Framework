plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.7.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.8.0'
    implementation 'io.cucumber:cucumber-testng:7.9.0'
    implementation 'io.cucumber:cucumber-core:7.9.0'
    implementation 'io.cucumber:cucumber-java:7.9.0'
    implementation 'io.cucumber:gherkin:25.0.2'

    // Add SLF4J implementation to fix logging warnings
    implementation 'org.slf4j:slf4j-simple:2.0.5'
}

test {
    useTestNG() {
        suites "src/test/resources/TestNG.xml"
        systemProperty "browser", System.getProperty("browser")

        // Add timeout setting for individual tests
        maxHeapSize = "1G"

        // Use default listeners for better reporting
        useDefaultListeners = true
    }

    // We need to handle parallel execution via TestNG.xml, not here

    // Increase test timeout
    maxParallelForks = 1

    // Show test output on console
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }

    // Set system properties for test execution
    systemProperties = [
            'org.uncommons.reportng.escape-output': 'false'
    ]
}